apiVersion: apps/v1
kind: Deployment

metadata:
  name: ia-transcription

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ia-transcription

  template:
    metadata:
      labels:
        app: ia-transcription

    spec:
      containers:
        - name: ia-transcription
          image: desarrollohusjp/ia-transcription:dev-8bd1e39
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: ia-transcription-config

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "2"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10