apiVersion: v1
kind: ConfigMap

metadata:
  name: ia-transcription-config
  namespace: dev
  
data:
  APP_NAME: "IA Transcription Service"
  APP_VERSION: "1.0.0"

  HOST: "0.0.0.0"
  PORT: "8080"

  ENVIRONMENT: "dev"

  CORS_ORIGINS: "http://192.168.8.1:5173, http://dev.soluciones.local, http://localhost:5173"

  WHISPER_MODEL: "small"
  WHISPER_DEVICE: "cpu"
  WHISPER_COMPUTE_TYPE: "int8"

  MAX_AUDIO_SIZE_MB: "20"

  LOG_LEVEL: "INFO"