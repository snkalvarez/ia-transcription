name: CI-CD - IA Transcription Service - Dev

on:
  push:
    branches:
      - dev
      - develop

jobs:
  build:
    name: CI - Build & Push Docker
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from SHA
        run: |
          VERSION=dev-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ia-transcription
          VERSION=${{ env.VERSION }}

          echo "Building image $IMAGE:$VERSION"

          docker build -t $IMAGE:$VERSION .

          docker push $IMAGE:$VERSION

  deploy:
    name: CD - Deploy to Kubernetes
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Extract version (same tag)
        run: |
          VERSION=dev-${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Deploy to K8s
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ia-transcription

          echo "Deploying $IMAGE:$VERSION to Kubernetes"

          kubectl set image deployment/ia-transcription ia-transcription=$IMAGE:$VERSION -n dev

          kubectl rollout status deployment/ia-transcription -n dev
