name: CI-CD - IA Transcription Service - Prod

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: CI - Build & Push Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ia-transcription-service
          VERSION=${{ github.ref_name }}

          echo "Building image $IMAGE:$VERSION"

          docker build -t $IMAGE:$VERSION .

          docker push $IMAGE:$VERSION

  deploy:
    name: CD - Deploy to Kubernetes
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Deploy to K8s
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ia-transcription-service
          VERSION=${{ github.ref_name }}

          echo "Deploying $IMAGE:$VERSION to Kubernetes"

          kubectl set image deployment/ia-transcription-service ia-transcription-service=$IMAGE:$VERSION -n prod

          kubectl rollout status deployment/ia-transcription-service -n prod
